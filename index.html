<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dalio Cycle Macro Tracker</title>
<style>
  :root {
    --bg: #0a0a0f;
    --bg-raised: #12121a;
    --border: #2a2a3a;
    --text: #e8e8f0;
    --text-secondary: #a0a0b8;
    --text-muted: #6a6a80;
    --accent: #5b8def;
    --accent-dim: rgba(91,141,239,0.12);
    --rise: #4ade80;
    --rise-dim: rgba(74,222,128,0.12);
    --top: #fbbf24;
    --top-dim: rgba(251,191,36,0.12);
    --decline: #f87171;
    --decline-dim: rgba(248,113,113,0.12);
    --danger: #ef4444;
    --radius: 10px;
    --radius-sm: 6px;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --mono: "SF Mono", Monaco, "Cascadia Code", monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
    min-height: 100vh;
  }
  header {
    border-bottom: 1px solid var(--border);
    padding: 16px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
    background: var(--bg-raised);
    position: sticky;
    top: 0;
    z-index: 100;
  }
  header h1 {
    font-size: 18px;
    font-weight: 600;
    letter-spacing: 0.3px;
  }
  header h1 span { color: var(--accent); }
  .header-meta {
    font-size: 12px;
    color: var(--text-muted);
    display: flex;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
  }
  .header-meta a {
    color: var(--text-muted);
    text-decoration: none;
    transition: color 0.15s;
  }
  .header-meta a:hover { color: var(--accent); }
  .last-updated { font-family: var(--mono); }

  .container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 24px;
  }

  .cycle-section { margin-bottom: 32px; }
  .cycle-section h2 {
    font-size: 14px;
    font-weight: 500;
    color: var(--text-secondary);
    margin-bottom: 16px;
    text-transform: lowercase;
    letter-spacing: 0.5px;
  }
  .cycle-wrap {
    position: relative;
    overflow-x: auto;
    padding-bottom: 8px;
  }
  .cycle-wrap::-webkit-scrollbar { height: 4px; }
  .cycle-wrap::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  #cycle-svg {
    display: block;
    min-width: 900px;
    width: 100%;
    height: auto;
  }
  .c-node {
    cursor: pointer;
    transition: all 0.15s ease-out;
  }
  .c-node:hover circle { stroke-width: 3px; filter: brightness(1.2); }
  .c-node.active circle { stroke: var(--text); stroke-width: 3px; filter: brightness(1.3); }
  .c-node.dimmed { opacity: 0.2; }
  .c-label { font-size: 10px; font-weight: 600; text-anchor: middle; pointer-events: none; fill: var(--text); }
  .c-phase { font-size: 12px; font-weight: 500; text-anchor: middle; pointer-events: none; }
  .c-arc { fill: none; stroke-width: 2px; opacity: 0.25; }
  .c-arc-rise { stroke: var(--rise); }
  .c-arc-decline { stroke: var(--decline); }

  .filters {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 24px;
    align-items: center;
  }
  .filters input, .filters select {
    background: var(--bg-raised);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 8px 12px;
    border-radius: var(--radius-sm);
    font-size: 13px;
    font-family: var(--font);
    outline: none;
    transition: border-color 0.15s;
  }
  .filters input:focus, .filters select:focus { border-color: var(--accent); }
  .filters input { min-width: 200px; }
  .filter-pill {
    padding: 6px 12px;
    border-radius: var(--radius-sm);
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text-secondary);
    transition: all 0.15s;
    user-select: none;
  }
  .filter-pill:hover { border-color: var(--text-secondary); color: var(--text); }
  .filter-pill.active { background: var(--accent-dim); border-color: var(--accent); color: var(--accent); }
  .filter-pill.rise.active { background: var(--rise-dim); border-color: var(--rise); color: var(--rise); }
  .filter-pill.top.active { background: var(--top-dim); border-color: var(--top); color: var(--top); }
  .filter-pill.decline.active { background: var(--decline-dim); border-color: var(--decline); color: var(--decline); }

  .events-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 16px;
  }
  .events-header h2 {
    font-size: 14px;
    font-weight: 500;
    color: var(--text-secondary);
    text-transform: lowercase;
    letter-spacing: 0.5px;
  }
  .events-count {
    font-size: 12px;
    color: var(--text-muted);
    font-family: var(--mono);
  }

  .events-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
    gap: 16px;
  }
  .event-card {
    background: var(--bg-raised);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    transition: all 0.15s;
    cursor: pointer;
    position: relative;
    overflow: hidden;
  }
  .event-card:hover {
    border-color: var(--text-muted);
    transform: translateY(-1px);
  }
  .event-card::before {
    content: "";
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: 3px;
    background: var(--border);
  }
  .event-card[data-phase="rise"]::before { background: var(--rise); }
  .event-card[data-phase="top"]::before { background: var(--top); }
  .event-card[data-phase="decline"]::before { background: var(--decline); }

  .event-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 8px;
    margin-bottom: 8px;
  }
  .event-title {
    font-size: 14px;
    font-weight: 500;
    line-height: 1.4;
    color: var(--text);
    text-decoration: none;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .event-title:hover { color: var(--accent); }
  .event-step {
    font-size: 11px;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: var(--radius-sm);
    white-space: nowrap;
    flex-shrink: 0;
  }
  .event-step.rise { background: var(--rise-dim); color: var(--rise); }
  .event-step.top { background: var(--top-dim); color: var(--top); }
  .event-step.decline { background: var(--decline-dim); color: var(--decline); }

  .event-meta {
    display: flex;
    gap: 12px;
    font-size: 11px;
    color: var(--text-muted);
    margin-bottom: 8px;
    flex-wrap: wrap;
  }
  .event-meta span { display: flex; align-items: center; gap: 4px; }
  .event-summary {
    font-size: 13px;
    color: var(--text-secondary);
    line-height: 1.5;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .event-tags {
    display: flex;
    gap: 6px;
    margin-top: 10px;
    flex-wrap: wrap;
  }
  .event-tag {
    font-size: 10px;
    padding: 2px 8px;
    border-radius: 4px;
    background: var(--bg);
    color: var(--text-muted);
    border: 1px solid var(--border);
  }

  .empty-state {
    text-align: center;
    padding: 48px;
    color: var(--text-muted);
    font-size: 14px;
  }

  .detail-panel {
    position: fixed;
    right: 0;
    top: 0;
    bottom: 0;
    width: 420px;
    max-width: 90vw;
    background: var(--bg-raised);
    border-left: 1px solid var(--border);
    padding: 24px;
    overflow-y: auto;
    z-index: 200;
    transform: translateX(100%);
    transition: transform 0.2s ease-out;
  }
  .detail-panel.open { transform: translateX(0); }
  .detail-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    z-index: 150;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s;
  }
  .detail-overlay.open { opacity: 1; pointer-events: auto; }
  .detail-close {
    position: absolute;
    top: 16px;
    right: 16px;
    background: none;
    border: none;
    color: var(--text-muted);
    font-size: 20px;
    cursor: pointer;
    padding: 4px;
    line-height: 1;
  }
  .detail-close:hover { color: var(--text); }
  .detail-step {
    font-size: 11px;
    font-weight: 600;
    padding: 4px 10px;
    border-radius: var(--radius-sm);
    display: inline-block;
    margin-bottom: 12px;
  }
  .detail-title {
    font-size: 18px;
    font-weight: 600;
    line-height: 1.3;
    margin-bottom: 12px;
  }
  .detail-title a { color: var(--text); text-decoration: none; }
  .detail-title a:hover { color: var(--accent); }
  .detail-meta {
    font-size: 12px;
    color: var(--text-muted);
    margin-bottom: 16px;
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
  }
  .detail-section { margin-bottom: 20px; }
  .detail-section h4 {
    font-size: 11px;
    font-weight: 600;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.8px;
    margin-bottom: 8px;
  }
  .detail-section p {
    font-size: 13px;
    color: var(--text-secondary);
    line-height: 1.6;
  }
  .detail-link {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 8px 16px;
    background: var(--accent-dim);
    color: var(--accent);
    border-radius: var(--radius-sm);
    text-decoration: none;
    font-size: 13px;
    font-weight: 500;
    margin-top: 8px;
    transition: background 0.15s;
  }
  .detail-link:hover { background: rgba(91,141,239,0.2); }
  .step-desc {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 12px;
    font-size: 12px;
    color: var(--text-secondary);
    line-height: 1.5;
    margin-top: 8px;
  }
  .step-desc strong { color: var(--text); }

  @media (max-width: 640px) {
    .events-grid { grid-template-columns: 1fr; }
    .filters input { min-width: 140px; width: 100%; }
    header { padding: 12px 16px; }
    .container { padding: 16px; }
  }
</style>
</head>
<body>

<header>
  <h1>dalio cycle <span>macro tracker</span></h1>
  <div class="header-meta">
    <span class="last-updated" id="last-updated">loading...</span>
    <a href="https://github.com/YOUR_USERNAME/dalio-cycle-tracker" target="_blank">github</a>
    <a href="#" onclick="showAbout(); return false;">about</a>
  </div>
</header>

<div class="container">

  <div class="cycle-section">
    <h2>the cycle — click a step to filter</h2>
    <div class="cycle-wrap">
      <svg viewBox="0 0 900 260" id="cycle-svg">
        <defs>
          <marker id="arrowhead" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="5" markerHeight="5" orient="auto">
            <path d="M0,0 L8,4 L0,8 Z" fill="var(--accent)" opacity="0.6"/>
          </marker>
        </defs>
        <path class="c-arc c-arc-rise" d="M 60 230 Q 60 50 360 50" />
        <path class="c-arc c-arc-decline" d="M 360 50 Q 660 50 660 230" />
        <text class="c-phase" x="180" y="250" fill="var(--rise)">the rise</text>
        <text class="c-phase" x="360" y="30" fill="var(--text)">the top</text>
        <text class="c-phase" x="540" y="250" fill="var(--decline)">the decline</text>

        <g class="c-node" data-step="1" data-phase="rise" transform="translate(80,210)">
          <circle r="14" fill="var(--rise-dim)" stroke="var(--rise)" stroke-width="1.5"/>
          <text class="c-label" y="4">1</text>
        </g>
        <g class="c-node" data-step="2" data-phase="rise" transform="translate(115,175)">
          <circle r="14" fill="var(--rise-dim)" stroke="var(--rise)" stroke-width="1.5"/>
          <text class="c-label" y="4">2</text>
        </g>
        <g class="c-node" data-step="3" data-phase="rise" transform="translate(150,145)">
          <circle r="14" fill="var(--rise-dim)" stroke="var(--rise)" stroke-width="1.5"/>
          <text class="c-label" y="4">3</text>
        </g>
        <g class="c-node" data-step="4" data-phase="rise" transform="translate(190,120)">
          <circle r="14" fill="var(--rise-dim)" stroke="var(--rise)" stroke-width="1.5"/>
          <text class="c-label" y="4">4</text>
        </g>
        <g class="c-node" data-step="5" data-phase="rise" transform="translate(235,100)">
          <circle r="14" fill="var(--rise-dim)" stroke="var(--rise)" stroke-width="1.5"/>
          <text class="c-label" y="4">5</text>
        </g>
        <g class="c-node" data-step="6" data-phase="rise" transform="translate(285,85)">
          <circle r="14" fill="var(--rise-dim)" stroke="var(--rise)" stroke-width="1.5"/>
          <text class="c-label" y="4">6</text>
        </g>
        <g class="c-node" data-step="7" data-phase="rise" transform="translate(335,75)">
          <circle r="14" fill="var(--rise-dim)" stroke="var(--rise)" stroke-width="1.5"/>
          <text class="c-label" y="4">7</text>
        </g>
        <g class="c-node" data-step="8" data-phase="rise" transform="translate(385,70)">
          <circle r="14" fill="var(--rise-dim)" stroke="var(--rise)" stroke-width="1.5"/>
          <text class="c-label" y="4">8</text>
        </g>
        <g class="c-node" data-step="9" data-phase="top" transform="translate(430,75)">
          <circle r="14" fill="var(--top-dim)" stroke="var(--top)" stroke-width="1.5"/>
          <text class="c-label" y="4">9</text>
        </g>
        <g class="c-node" data-step="10" data-phase="top" transform="translate(470,90)">
          <circle r="14" fill="var(--top-dim)" stroke="var(--top)" stroke-width="1.5"/>
          <text class="c-label" y="4">10</text>
        </g>
        <g class="c-node" data-step="11" data-phase="top" transform="translate(505,110)">
          <circle r="14" fill="var(--top-dim)" stroke="var(--top)" stroke-width="1.5"/>
          <text class="c-label" y="4">11</text>
        </g>
        <g class="c-node" data-step="12" data-phase="top" transform="translate(535,135)">
          <circle r="14" fill="var(--top-dim)" stroke="var(--top)" stroke-width="1.5"/>
          <text class="c-label" y="4">12</text>
        </g>
        <g class="c-node" data-step="13" data-phase="decline" transform="translate(560,170)">
          <circle r="14" fill="var(--decline-dim)" stroke="var(--decline)" stroke-width="1.5"/>
          <text class="c-label" y="4">13</text>
        </g>
        <g class="c-node" data-step="14" data-phase="decline" transform="translate(575,205)">
          <circle r="14" fill="var(--decline-dim)" stroke="var(--decline)" stroke-width="1.5"/>
          <text class="c-label" y="4">14</text>
        </g>
        <g class="c-node" data-step="15" data-phase="decline" transform="translate(590,240)">
          <circle r="14" fill="var(--decline-dim)" stroke="var(--decline)" stroke-width="1.5"/>
          <text class="c-label" y="4">15</text>
        </g>
        <g class="c-node" data-step="16" data-phase="decline" transform="translate(615,270)">
          <circle r="16" fill="var(--decline-dim)" stroke="var(--danger)" stroke-width="2"/>
          <text class="c-label" y="4">16</text>
        </g>
        <g class="c-node" data-step="17" data-phase="decline" transform="translate(655,275)">
          <circle r="14" fill="var(--decline-dim)" stroke="var(--decline)" stroke-width="1.5"/>
          <text class="c-label" y="4">17</text>
        </g>
        <g class="c-node" data-step="18" data-phase="decline" transform="translate(700,270)">
          <circle r="14" fill="var(--decline-dim)" stroke="var(--decline)" stroke-width="1.5"/>
          <text class="c-label" y="4">18</text>
        </g>
      </svg>
    </div>
  </div>

  <div class="filters">
    <input type="text" id="search-input" placeholder="search events..." />
    <select id="region-filter">
      <option value="">all regions</option>
      <option value="us">united states</option>
      <option value="china">china</option>
      <option value="europe">europe</option>
      <option value="japan">japan</option>
      <option value="global">global</option>
    </select>
    <select id="source-filter">
      <option value="">all sources</option>
      <option value="news">news</option>
      <option value="fed">fed / central bank</option>
      <option value="treasury">treasury</option>
      <option value="data">economic data</option>
      <option value="geopolitical">geopolitical</option>
    </select>
    <button class="filter-pill rise" data-phase="rise" onclick="togglePhase(this)">rise</button>
    <button class="filter-pill top" data-phase="top" onclick="togglePhase(this)">top</button>
    <button class="filter-pill decline" data-phase="decline" onclick="togglePhase(this)">decline</button>
    <button class="filter-pill" onclick="clearFilters()">clear</button>
  </div>

  <div class="events-header">
    <h2>tracked events</h2>
    <span class="events-count" id="events-count">0 events</span>
  </div>

  <div class="events-grid" id="events-grid">
    <div class="empty-state">loading events...</div>
  </div>

</div>

<div class="detail-overlay" id="detail-overlay" onclick="closeDetail()"></div>
<div class="detail-panel" id="detail-panel">
  <button class="detail-close" onclick="closeDetail()">&times;</button>
  <div id="detail-content"></div>
</div>

<script>
const STEPS = {
  1: { name: "Strong Leadership", phase: "rise", desc: "Rising empires begin with strong, capable leadership that unifies and directs the nation toward growth." },
  2: { name: "Inventiveness", phase: "rise", desc: "Investment in education, technology, and innovation drives the next wave of competitiveness." },
  3: { name: "Education", phase: "rise", desc: "Human capital development creates a skilled workforce that powers economic expansion." },
  4: { name: "Strong Culture", phase: "rise", desc: "Shared values and cultural cohesion bind society together and enable collective action." },
  5: { name: "Good Resource Allocation", phase: "rise", desc: "Efficient allocation of capital and resources toward productive uses drives growth." },
  6: { name: "Good Competitiveness", phase: "rise", desc: "Rising competitiveness in trade, productivity, and global markets accelerates wealth creation." },
  7: { name: "Strong Income Growth", phase: "rise", desc: "Rising incomes lift living standards and create domestic demand that sustains expansion." },
  8: { name: "Strong Markets & Financial Centers", phase: "rise", desc: "Deepening financial markets attract global capital and cement the empire's economic position." },
  9: { name: "Less Productive", phase: "top", desc: "At the peak, productivity growth slows as the empire becomes complacent and less efficient." },
  10: { name: "Overextended", phase: "top", desc: "The empire overextends militarily, financially, and geopolitically beyond its sustainable capacity." },
  11: { name: "Losing Competitiveness", phase: "top", desc: "Competitiveness erodes as costs rise, regulation grows, and rival powers catch up." },
  12: { name: "Wealth Gaps", phase: "top", desc: "Wealth inequality widens dramatically as asset owners benefit while workers stagnate." },
  13: { name: "Large Debts", phase: "decline", desc: "Debt burdens grow unsustainably as the empire finances its lifestyle and obligations." },
  14: { name: "Printing Money", phase: "decline", desc: "Monetary debasement accelerates to finance debts, eroding real purchasing power." },
  15: { name: "Internal Conflict", phase: "decline", desc: "Internal divisions fragment society — political, cultural, and class conflicts weaken cohesion." },
  16: { name: "Loss of Reserve Currency", phase: "decline", desc: "The reserve currency status erodes, removing the exorbitant privilege that financed dominance." },
  17: { name: "Weak Leadership", phase: "decline", desc: "Leadership becomes ineffective, corrupt, or divided — unable to reverse the decline." },
  18: { name: "Civil War / Revolution", phase: "decline", desc: "The empire collapses into internal violence or revolution as the old order breaks down." }
};

let allEvents = [];
let activeStep = null;
let activePhases = new Set();

async function loadEvents() {
  try {
    const res = await fetch('data/events.json?t=' + Date.now());
    const data = await res.json();
    allEvents = data.events || [];
    document.getElementById('last-updated').textContent = 'updated: ' + (data.lastUpdated || 'unknown');
    renderEvents();
  } catch (e) {
    document.getElementById('events-grid').innerHTML = '<div class="empty-state">failed to load events. check console.</div>';
    console.error(e);
  }
}

function renderEvents() {
  const search = document.getElementById('search-input').value.toLowerCase();
  const region = document.getElementById('region-filter').value;
  const source = document.getElementById('source-filter').value;

  let filtered = allEvents.filter(ev => {
    if (activeStep && ev.step !== activeStep) return false;
    if (activePhases.size > 0 && !activePhases.has(STEPS[ev.step].phase)) return false;
    if (search && !ev.title.toLowerCase().includes(search) && !ev.summary.toLowerCase().includes(search)) return false;
    if (region && ev.region !== region) return false;
    if (source && ev.sourceType !== source) return false;
    return true;
  });

  filtered.sort((a, b) => new Date(b.date) - new Date(a.date));
  document.getElementById('events-count').textContent = filtered.length + ' event' + (filtered.length !== 1 ? 's' : '');

  const grid = document.getElementById('events-grid');
  if (filtered.length === 0) {
    grid.innerHTML = '<div class="empty-state">no events match your filters.</div>';
    return;
  }

  grid.innerHTML = filtered.map(ev => {
    const step = STEPS[ev.step];
    const dateStr = new Date(ev.date).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
    return `
      <div class="event-card" data-phase="${step.phase}" onclick="openDetail(${ev.id})">
        <div class="event-header">
          <a class="event-title" href="${ev.url}" target="_blank" onclick="event.stopPropagation()">${escapeHtml(ev.title)}</a>
          <span class="event-step ${step.phase}">step ${ev.step}: ${step.name}</span>
        </div>
        <div class="event-meta">
          <span>${dateStr}</span>
          <span>${ev.source}</span>
          <span>${ev.region}</span>
        </div>
        <div class="event-summary">${escapeHtml(ev.summary)}</div>
        <div class="event-tags">
          ${(ev.tags || []).map(t => `<span class="event-tag">${escapeHtml(t)}</span>`).join('')}
        </div>
      </div>
    `;
  }).join('');
}

function openDetail(id) {
  const ev = allEvents.find(e => e.id === id);
  if (!ev) return;
  const step = STEPS[ev.step];
  const dateStr = new Date(ev.date).toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });

  const content = `
    <span class="detail-step ${step.phase}">step ${ev.step}: ${step.name}</span>
    <div class="detail-title"><a href="${ev.url}" target="_blank">${escapeHtml(ev.title)}</a></div>
    <div class="detail-meta">
      <span>${dateStr}</span>
      <span>${ev.source}</span>
      <span>${ev.region}</span>
      <span>${ev.sourceType}</span>
    </div>
    <div class="detail-section">
      <h4>Summary</h4>
      <p>${escapeHtml(ev.summary)}</p>
    </div>
    ${ev.dalioConnection ? `
    <div class="detail-section">
      <h4>Connection to Dalio Cycle</h4>
      <p>${escapeHtml(ev.dalioConnection)}</p>
    </div>
    ` : ''}
    ${ev.thesisConnection ? `
    <div class="detail-section">
      <h4>Capital Flow Thesis Connection</h4>
      <p>${escapeHtml(ev.thesisConnection)}</p>
    </div>
    ` : ''}
    <div class="detail-section">
      <h4>What to Watch</h4>
      <p>${escapeHtml(ev.watch || 'Monitor follow-on policy actions and market reactions.')}</p>
    </div>
    <div class="detail-section">
      <h4>About This Step</h4>
      <div class="step-desc"><strong>${step.name}:</strong> ${step.desc}</div>
    </div>
    <a class="detail-link" href="${ev.url}" target="_blank">read original source &rarr;</a>
  `;

  document.getElementById('detail-content').innerHTML = content;
  document.getElementById('detail-panel').classList.add('open');
  document.getElementById('detail-overlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeDetail() {
  document.getElementById('detail-panel').classList.remove('open');
  document.getElementById('detail-overlay').classList.remove('open');
  document.body.style.overflow = '';
}

function escapeHtml(str) {
  if (!str) return '';
  return str.replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

function setupCycleNodes() {
  document.querySelectorAll('.c-node').forEach(node => {
    node.addEventListener('click', () => {
      const step = parseInt(node.getAttribute('data-step'));
      if (activeStep === step) {
        activeStep = null;
        node.classList.remove('active');
      } else {
        document.querySelectorAll('.c-node').forEach(n => n.classList.remove('active'));
        activeStep = step;
        node.classList.add('active');
      }
      renderEvents();
    });
  });
}

function togglePhase(btn) {
  const phase = btn.getAttribute('data-phase');
  if (activePhases.has(phase)) {
    activePhases.delete(phase);
    btn.classList.remove('active');
  } else {
    activePhases.add(phase);
    btn.classList.add('active');
  }
  renderEvents();
}

function clearFilters() {
  activeStep = null;
  activePhases.clear();
  document.getElementById('search-input').value = '';
  document.getElementById('region-filter').value = '';
  document.getElementById('source-filter').value = '';
  document.querySelectorAll('.c-node').forEach(n => n.classList.remove('active'));
  document.querySelectorAll('.filter-pill').forEach(p => p.classList.remove('active'));
  renderEvents();
}

function showAbout() {
  const content = `
    <span class="detail-step" style="background:var(--accent-dim);color:var(--accent)">about</span>
    <div class="detail-title">Dalio Cycle Macro Tracker</div>
    <div class="detail-section">
      <h4>Purpose</h4>
      <p>This tracker maps real-world macro events to Ray Dalio's 18-step empire cycle, overlaying the capital flow thesis: that international capital flows between the US and China are the root mechanism driving valuations, policy, and the AI arms race.</p>
    </div>
    <div class="detail-section">
      <h4>How It Works</h4>
      <p>Events are tagged to specific steps in the cycle. The tracker monitors news from central banks, treasuries, geopolitical developments, and economic data releases. Each event includes a connection to both the Dalio framework and the capital flow thesis.</p>
    </div>
    <div class="detail-section">
      <h4>Contributing</h4>
      <p>This is open source. Add events by editing <code>data/events.json</code> and submitting a pull request. The GitHub Actions workflow can also auto-fetch news daily.</p>
    </div>
    <div class="detail-section">
      <h4>The 18 Steps</h4>
      <p><strong style="color:var(--rise)">Rise (1-8):</strong> Strong leadership, inventiveness, education, culture, resource allocation, competitiveness, income growth, financial centers.<br><br>
      <strong style="color:var(--top)">Top (9-12):</strong> Less productive, overextended, losing competitiveness, wealth gaps.<br><br>
      <strong style="color:var(--decline)">Decline (13-18):</strong> Large debts, printing money, internal conflict, loss of reserve currency, weak leadership, civil war/revolution.</p>
    </div>
  `;
  document.getElementById('detail-content').innerHTML = content;
  document.getElementById('detail-panel').classList.add('open');
  document.getElementById('detail-overlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}

document.getElementById('search-input').addEventListener('input', renderEvents);
document.getElementById('region-filter').addEventListener('change', renderEvents);
document.getElementById('source-filter').addEventListener('change', renderEvents);
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDetail(); });

setupCycleNodes();
loadEvents();
</script>

</body>
</html>
