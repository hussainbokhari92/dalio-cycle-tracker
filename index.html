<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dalio Cycle Macro Tracker</title>
<style>
  :root {
    --bg: #0a0a0f;
    --bg-raised: #12121a;
    --border: #2a2a3a;
    --text: #e8e8f0;
    --text-secondary: #a0a0b8;
    --text-muted: #6a6a80;
    --text-quaternary: #4a4a5a;
    --accent: #5b8def;
    --accent-dim: rgba(91,141,239,0.12);
    --rise: #4ade80;
    --rise-dim: rgba(74,222,128,0.12);
    --top: #fbbf24;
    --top-dim: rgba(251,191,36,0.12);
    --decline: #f87171;
    --decline-dim: rgba(248,113,113,0.12);
    --danger: #ef4444;
    --radius: 10px;
    --radius-sm: 6px;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --mono: "SF Mono", Monaco, "Cascadia Code", monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
    min-height: 100vh;
  }
  header {
    border-bottom: 1px solid var(--border);
    padding: 16px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
    background: var(--bg-raised);
    position: sticky;
    top: 0;
    z-index: 100;
  }
  header h1 {
    font-size: 18px;
    font-weight: 600;
    letter-spacing: 0.3px;
  }
  header h1 span { color: var(--accent); }
  .header-meta {
    font-size: 12px;
    color: var(--text-muted);
    display: flex;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
  }
  .header-meta a {
    color: var(--text-muted);
    text-decoration: none;
    transition: color 0.15s;
  }
  .header-meta a:hover { color: var(--accent); }
  .last-updated { font-family: var(--mono); }

  .container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 24px;
  }

  /* ===== CYCLE ===== */
  .cycle-section { margin-bottom: 28px; }
  .cycle-section h2 {
    font-size: 13px;
    font-weight: 500;
    color: var(--text-secondary);
    margin-bottom: 16px;
    text-transform: lowercase;
    letter-spacing: 0.5px;
  }
  .cycle-wrap {
    position: relative;
    overflow-x: auto;
    padding: 8px 0 16px;
  }
  .cycle-wrap::-webkit-scrollbar { height: 4px; }
  .cycle-wrap::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  #cycle-svg {
    display: block;
    min-width: 860px;
    width: 100%;
    height: auto;
  }
  .c-node { cursor: pointer; }
  .c-node circle {
    transition: all 0.2s ease-out;
  }
  .c-node:hover circle {
    r: 20;
    filter: brightness(1.3);
  }
  .c-node.active circle {
    stroke: var(--text);
    stroke-width: 3px;
    filter: brightness(1.4);
  }
  .c-node.dimmed { opacity: 0.12; }
  .c-label {
    font-size: 11px;
    font-weight: 600;
    text-anchor: middle;
    pointer-events: none;
    fill: var(--text);
  }
  .c-label-name {
    font-size: 9px;
    font-weight: 400;
    text-anchor: middle;
    pointer-events: none;
    fill: var(--text-muted);
    opacity: 0;
    transition: opacity 0.2s;
  }
  .c-node:hover + .c-label-name,
  .c-node.active + .c-label-name {
    opacity: 1;
  }
  .c-phase-bg { opacity: 0.06; }
  .c-phase-label {
    font-size: 11px;
    font-weight: 500;
    text-anchor: middle;
    pointer-events: none;
    fill: var(--text-quaternary);
    text-transform: uppercase;
    letter-spacing: 1.5px;
  }
  .c-arc {
    fill: none;
    stroke-width: 2px;
    opacity: 0.2;
  }

  /* Tooltip */
  .cycle-tooltip {
    position: absolute;
    background: var(--bg-raised);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 12px 16px;
    font-size: 12px;
    line-height: 1.5;
    color: var(--text-secondary);
    pointer-events: none;
    opacity: 0;
    transform: translateY(4px);
    transition: all 0.15s ease-out;
    z-index: 50;
    max-width: 260px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.3);
  }
  .cycle-tooltip.visible {
    opacity: 1;
    transform: translateY(0);
  }
  .cycle-tooltip strong {
    color: var(--text);
    display: block;
    margin-bottom: 4px;
    font-size: 13px;
  }
  .tt-phase {
    display: inline-block;
    padding: 1px 8px;
    border-radius: 4px;
    font-size: 10px;
    font-weight: 500;
    margin-bottom: 6px;
  }
  .tt-desc { font-size: 11px; line-height: 1.5; }

  /* ===== CHART ===== */
  .chart-section { margin-bottom: 32px; }
  .chart-section h2 {
    font-size: 13px;
    font-weight: 500;
    color: var(--text-secondary);
    margin-bottom: 16px;
    text-transform: lowercase;
    letter-spacing: 0.5px;
  }
  .chart-wrap {
    position: relative;
    background: var(--bg-raised);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    overflow-x: auto;
  }
  .chart-wrap canvas {
    display: block;
    min-width: 860px;
    width: 100%;
    height: auto;
  }
  .chart-legend {
    display: flex;
    gap: 16px;
    margin-top: 12px;
    font-size: 11px;
    color: var(--text-muted);
    flex-wrap: wrap;
  }
  .chart-legend span {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .chart-legend i {
    display: inline-block;
    width: 10px;
    height: 10px;
    border-radius: 2px;
  }

  /* ===== FILTERS ===== */
  .filters {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 24px;
    align-items: center;
  }
  .filters input, .filters select {
    background: var(--bg-raised);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 8px 12px;
    border-radius: var(--radius-sm);
    font-size: 13px;
    font-family: var(--font);
    outline: none;
    transition: border-color 0.15s;
  }
  .filters input:focus, .filters select:focus { border-color: var(--accent); }
  .filters input { min-width: 200px; }
  .filter-pill {
    padding: 6px 12px;
    border-radius: var(--radius-sm);
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text-secondary);
    transition: all 0.15s;
    user-select: none;
  }
  .filter-pill:hover { border-color: var(--text-secondary); color: var(--text); }
  .filter-pill.active { background: var(--accent-dim); border-color: var(--accent); color: var(--accent); }
  .filter-pill.rise.active { background: var(--rise-dim); border-color: var(--rise); color: var(--rise); }
  .filter-pill.top.active { background: var(--top-dim); border-color: var(--top); color: var(--top); }
  .filter-pill.decline.active { background: var(--decline-dim); border-color: var(--decline); color: var(--decline); }

  /* ===== EVENTS ===== */
  .events-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 16px;
  }
  .events-header h2 {
    font-size: 13px;
    font-weight: 500;
    color: var(--text-secondary);
    text-transform: lowercase;
    letter-spacing: 0.5px;
  }
  .events-count {
    font-size: 12px;
    color: var(--text-muted);
    font-family: var(--mono);
  }
  .events-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
    gap: 16px;
  }
  .event-card {
    background: var(--bg-raised);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    transition: all 0.15s;
    cursor: pointer;
    position: relative;
    overflow: hidden;
  }
  .event-card:hover {
    border-color: var(--text-muted);
    transform: translateY(-1px);
  }
  .event-card::before {
    content: "";
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: 3px;
    background: var(--border);
  }
  .event-card[data-phase="rise"]::before { background: var(--rise); }
  .event-card[data-phase="top"]::before { background: var(--top); }
  .event-card[data-phase="decline"]::before { background: var(--decline); }

  .event-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 8px;
    margin-bottom: 8px;
  }
  .event-title {
    font-size: 14px;
    font-weight: 500;
    line-height: 1.4;
    color: var(--text);
    text-decoration: none;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .event-title:hover { color: var(--accent); }
  .event-step {
    font-size: 11px;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: var(--radius-sm);
    white-space: nowrap;
    flex-shrink: 0;
  }
  .event-step.rise { background: var(--rise-dim); color: var(--rise); }
  .event-step.top { background: var(--top-dim); color: var(--top); }
  .event-step.decline { background: var(--decline-dim); color: var(--decline); }

  .event-meta {
    display: flex;
    gap: 12px;
    font-size: 11px;
    color: var(--text-muted);
    margin-bottom: 8px;
    flex-wrap: wrap;
  }
  .event-meta span { display: flex; align-items: center; gap: 4px; }
  .event-summary {
    font-size: 13px;
    color: var(--text-secondary);
    line-height: 1.5;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .event-tags {
    display: flex;
    gap: 6px;
    margin-top: 10px;
    flex-wrap: wrap;
  }
  .event-tag {
    font-size: 10px;
    padding: 2px 8px;
    border-radius: 4px;
    background: var(--bg);
    color: var(--text-muted);
    border: 1px solid var(--border);
  }

  .empty-state {
    text-align: center;
    padding: 48px;
    color: var(--text-muted);
    font-size: 14px;
  }

  /* ===== DETAIL PANEL ===== */
  .detail-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    z-index: 150;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s;
  }
  .detail-overlay.open { opacity: 1; pointer-events: auto; }
  .detail-panel {
    position: fixed;
    right: 0;
    top: 0;
    bottom: 0;
    width: 420px;
    max-width: 90vw;
    background: var(--bg-raised);
    border-left: 1px solid var(--border);
    padding: 24px;
    overflow-y: auto;
    z-index: 200;
    transform: translateX(100%);
    transition: transform 0.2s ease-out;
  }
  .detail-panel.open { transform: translateX(0); }
  .detail-close {
    position: absolute;
    top: 16px;
    right: 16px;
    background: none;
    border: none;
    color: var(--text-muted);
    font-size: 20px;
    cursor: pointer;
    padding: 4px;
    line-height: 1;
  }
  .detail-close:hover { color: var(--text); }
  .detail-step {
    font-size: 11px;
    font-weight: 600;
    padding: 4px 10px;
    border-radius: var(--radius-sm);
    display: inline-block;
    margin-bottom: 12px;
  }
  .detail-title {
    font-size: 18px;
    font-weight: 600;
    line-height: 1.3;
    margin-bottom: 12px;
  }
  .detail-title a { color: var(--text); text-decoration: none; }
  .detail-title a:hover { color: var(--accent); }
  .detail-meta {
    font-size: 12px;
    color: var(--text-muted);
    margin-bottom: 16px;
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
  }
  .detail-section { margin-bottom: 20px; }
  .detail-section h4 {
    font-size: 11px;
    font-weight: 600;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.8px;
    margin-bottom: 8px;
  }
  .detail-section p {
    font-size: 13px;
    color: var(--text-secondary);
    line-height: 1.6;
  }
  .detail-link {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 8px 16px;
    background: var(--accent-dim);
    color: var(--accent);
    border-radius: var(--radius-sm);
    text-decoration: none;
    font-size: 13px;
    font-weight: 500;
    margin-top: 8px;
    transition: background 0.15s;
  }
  .detail-link:hover { background: rgba(91,141,239,0.2); }
  .step-desc {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 12px;
    font-size: 12px;
    color: var(--text-secondary);
    line-height: 1.5;
    margin-top: 8px;
  }
  .step-desc strong { color: var(--text); }

  @media (max-width: 640px) {
    .events-grid { grid-template-columns: 1fr; }
    .filters input { min-width: 140px; width: 100%; }
    header { padding: 12px 16px; }
    .container { padding: 16px; }
  }
</style>
</head>
<body>

<header>
  <h1>dalio cycle <span>macro tracker</span></h1>
  <div class="header-meta">
    <span class="last-updated" id="last-updated">loading...</span>
    <a href="https://github.com/YOUR_USERNAME/dalio-cycle-tracker" target="_blank">github</a>
    <a href="#" onclick="showAbout(); return false;">about</a>
  </div>
</header>

<div class="container">

  <!-- CYCLE -->
  <div class="cycle-section">
    <h2>the cycle — hover for details, click to filter events</h2>
    <div class="cycle-wrap" id="cycle-wrap">
      <svg viewBox="0 0 900 320" id="cycle-svg">
        <defs>
          <linearGradient id="grad-rise" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="var(--rise)" stop-opacity="0.08"/>
            <stop offset="100%" stop-color="var(--rise)" stop-opacity="0.02"/>
          </linearGradient>
          <linearGradient id="grad-top" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="var(--top)" stop-opacity="0.08"/>
            <stop offset="100%" stop-color="var(--top)" stop-opacity="0.02"/>
          </linearGradient>
          <linearGradient id="grad-decline" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="var(--decline)" stop-opacity="0.08"/>
            <stop offset="100%" stop-color="var(--decline)" stop-opacity="0.02"/>
          </linearGradient>
        </defs>

        <!-- Phase background bands -->
        <path class="c-phase-bg" d="M 60 280 Q 60 40 360 40 L 360 120 Q 180 120 60 280 Z" fill="url(#grad-rise)"/>
        <path class="c-phase-bg" d="M 360 40 Q 660 40 660 280 L 540 280 Q 540 120 360 120 Z" fill="url(#grad-decline)"/>
        <ellipse cx="360" cy="80" rx="80" ry="40" class="c-phase-bg" fill="url(#grad-top)"/>

        <!-- Arcs -->
        <path class="c-arc" d="M 80 260 Q 80 60 360 60" stroke="var(--rise)" stroke-dasharray="4,3"/>
        <path class="c-arc" d="M 360 60 Q 640 60 640 260" stroke="var(--decline)" stroke-dasharray="4,3"/>

        <!-- Phase labels -->
        <text class="c-phase-label" x="180" y="295">the rise</text>
        <text class="c-phase-label" x="360" y="28">the top</text>
        <text class="c-phase-label" x="540" y="295">the decline</text>

        <!-- Counterattack arrow -->
        <path d="M 620 240 Q 580 100 460 90 Q 400 85 340 110" fill="none" stroke="var(--accent)" stroke-width="2" stroke-dasharray="6,4" opacity="0.5" marker-end="url(#arrow)"/>
        <defs>
          <marker id="arrow" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="5" markerHeight="5" orient="auto">
            <path d="M0,0 L8,4 L0,8 Z" fill="var(--accent)" opacity="0.6"/>
          </marker>
        </defs>
        <text x="520" y="75" fill="var(--accent)" style="font-size:10px;font-weight:500;text-anchor:middle;opacity:0.7">counterattack</text>

        <!-- RISE nodes 1-8 -->
        <g class="c-node" data-step="1" data-phase="rise" transform="translate(95,235)"><circle r="16" fill="var(--rise-dim)" stroke="var(--rise)" stroke-width="1.5"/><text class="c-label" y="4">1</text></g>
        <text class="c-label-name" x="95" y="258">leadership</text>

        <g class="c-node" data-step="2" data-phase="rise" transform="translate(130,195)"><circle r="16" fill="var(--rise-dim)" stroke="var(--rise)" stroke-width="1.5"/><text class="c-label" y="4">2</text></g>
        <text class="c-label-name" x="130" y="218">inventiveness</text>

        <g class="c-node" data-step="3" data-phase="rise" transform="translate(170,160)"><circle r="16" fill="var(--rise-dim)" stroke="var(--rise)" stroke-width="1.5"/><text class="c-label" y="4">3</text></g>
        <text class="c-label-name" x="170" y="183">education</text>

        <g class="c-node" data-step="4" data-phase="rise" transform="translate(215,130)"><circle r="16" fill="var(--rise-dim)" stroke="var(--rise)" stroke-width="1.5"/><text class="c-label" y="4">4</text></g>
        <text class="c-label-name" x="215" y="153">culture</text>

        <g class="c-node" data-step="5" data-phase="rise" transform="translate(265,105)"><circle r="16" fill="var(--rise-dim)" stroke="var(--rise)" stroke-width="1.5"/><text class="c-label" y="4">5</text></g>
        <text class="c-label-name" x="265" y="128">resources</text>

        <g class="c-node" data-step="6" data-phase="rise" transform="translate(315,88)"><circle r="16" fill="var(--rise-dim)" stroke="var(--rise)" stroke-width="1.5"/><text class="c-label" y="4">6</text></g>
        <text class="c-label-name" x="315" y="111">compete</text>

        <g class="c-node" data-step="7" data-phase="rise" transform="translate(365,78)"><circle r="16" fill="var(--rise-dim)" stroke="var(--rise)" stroke-width="1.5"/><text class="c-label" y="4">7</text></g>
        <text class="c-label-name" x="365" y="101">income</text>

        <g class="c-node" data-step="8" data-phase="rise" transform="translate(415,75)"><circle r="16" fill="var(--rise-dim)" stroke="var(--rise)" stroke-width="1.5"/><text class="c-label" y="4">8</text></g>
        <text class="c-label-name" x="415" y="98">markets</text>

        <!-- TOP nodes 9-12 -->
        <g class="c-node" data-step="9" data-phase="top" transform="translate(460,80)"><circle r="16" fill="var(--top-dim)" stroke="var(--top)" stroke-width="1.5"/><text class="c-label" y="4">9</text></g>
        <text class="c-label-name" x="460" y="103">productivity</text>

        <g class="c-node" data-step="10" data-phase="top" transform="translate(500,95)"><circle r="16" fill="var(--top-dim)" stroke="var(--top)" stroke-width="1.5"/><text class="c-label" y="4">10</text></g>
        <text class="c-label-name" x="500" y="118">overextended</text>

        <g class="c-node" data-step="11" data-phase="top" transform="translate(535,118)"><circle r="16" fill="var(--top-dim)" stroke="var(--top)" stroke-width="1.5"/><text class="c-label" y="4">11</text></g>
        <text class="c-label-name" x="535" y="141">competitiveness</text>

        <g class="c-node" data-step="12" data-phase="top" transform="translate(565,148)"><circle r="16" fill="var(--top-dim)" stroke="var(--top)" stroke-width="1.5"/><text class="c-label" y="4">12</text></g>
        <text class="c-label-name" x="565" y="171">wealth gaps</text>

        <!-- DECLINE nodes 13-18 -->
        <g class="c-node" data-step="13" data-phase="decline" transform="translate(590,185)"><circle r="16" fill="var(--decline-dim)" stroke="var(--decline)" stroke-width="1.5"/><text class="c-label" y="4">13</text></g>
        <text class="c-label-name" x="590" y="208">large debts</text>

        <g class="c-node" data-step="14" data-phase="decline" transform="translate(608,225)"><circle r="16" fill="var(--decline-dim)" stroke="var(--decline)" stroke-width="1.5"/><text class="c-label" y="4">14</text></g>
        <text class="c-label-name" x="608" y="248">printing money</text>

        <g class="c-node" data-step="15" data-phase="decline" transform="translate(622,265)"><circle r="16" fill="var(--decline-dim)" stroke="var(--decline)" stroke-width="1.5"/><text class="c-label" y="4">15</text></g>
        <text class="c-label-name" x="622" y="288">internal conflict</text>

        <g class="c-node" data-step="16" data-phase="decline" transform="translate(640,295)"><circle r="18" fill="var(--decline-dim)" stroke="var(--danger)" stroke-width="2.5"/><text class="c-label" y="4">16</text></g>
        <text class="c-label-name" x="640" y="321" style="fill:var(--danger);font-weight:500">reserve currency</text>

        <g class="c-node" data-step="17" data-phase="decline" transform="translate(680,300)"><circle r="16" fill="var(--decline-dim)" stroke="var(--decline)" stroke-width="1.5"/><text class="c-label" y="4">17</text></g>
        <text class="c-label-name" x="680" y="323">weak leadership</text>

        <g class="c-node" data-step="18" data-phase="decline" transform="translate(725,295)"><circle r="16" fill="var(--decline-dim)" stroke="var(--decline)" stroke-width="1.5"/><text class="c-label" y="4">18</text></g>
        <text class="c-label-name" x="725" y="318">civil war</text>
      </svg>

      <div class="cycle-tooltip" id="cycle-tooltip">
        <span class="tt-phase" id="tt-phase"></span>

function escapeHtml(str) {
  if (!str) return '';

function getStepLabel(stepNum) {

// ============================================================
// ECON CHART
// ============================================================
function drawEconChart() {
  const canvas = document.getElementById('econ-cycle-canvas');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  const rect = canvas.getBoundingClientRect();
  canvas.width = rect.width * dpr;
  canvas.height = rect.height * dpr;
  ctx.scale(dpr, dpr);
  const w = rect.width, h = rect.height;
  const pad = { top: 20, right: 50, bottom: 35, left: 50 };
  const cw = w - pad.left - pad.right;
  const ch = h - pad.top - pad.bottom;

  ctx.clearRect(0, 0, w, h);
  ctx.strokeStyle = 'rgba(42,42,58,0.5)';
  ctx.lineWidth = 1;
  for (let i = 0; i <= 5; i++) {
    const y = pad.top + (ch / 5) * i;
    ctx.beginPath(); ctx.moveTo(pad.left, y); ctx.lineTo(pad.left + cw, y); ctx.stroke();
  }
  ctx.fillStyle = '#6a6a80';
  ctx.font = '10px "SF Mono", monospace';
  ctx.textAlign = 'center';
  CHART_DATA.labels.forEach((label, i) => {
    const x = pad.left + (cw / (CHART_DATA.labels.length - 1)) * i;
    ctx.fillText(label, x, h - 8);
  });

  const recessions = [[4,5], [10,11]];
  recessions.forEach(([start, end]) => {
    const x1 = pad.left + (cw / (CHART_DATA.labels.length - 1)) * start;
    const x2 = pad.left + (cw / (CHART_DATA.labels.length - 1)) * end;
    ctx.fillStyle = 'rgba(248,113,113,0.06)';
    ctx.fillRect(x1, pad.top, x2 - x1, ch);
  });

  function drawSeries(data, color, width, scaleFn) {
    ctx.strokeStyle = color; ctx.lineWidth = width; ctx.lineJoin = 'round';
    ctx.beginPath();
    const pts = data.map((val, i) => {
      const x = pad.left + (cw / (data.length - 1)) * i;
      const y = pad.top + ch - scaleFn(val) * ch;
      return [x, y];
    });
    pts.forEach(([x, y], i) => { if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y); });
    ctx.stroke();
    ctx.fillStyle = color;
    pts.forEach(([x, y], i) => { if (i % 2 === 0) { ctx.beginPath(); ctx.arc(x, y, 2.5, 0, Math.PI * 2); ctx.fill(); } });
  }

  const norm = (arr) => { const min = Math.min(...arr), max = Math.max(...arr); return arr.map(v => (v - min) / (max - min || 1)); };
  drawSeries(norm(CHART_DATA.gdp), '#4ade80', 2.5, v => v);
  drawSeries(norm(CHART_DATA.debt), '#5b8def', 2, v => v);
  drawSeries(norm(CHART_DATA.assets), '#fbbf24', 2, v => v);
  drawSeries(norm(CHART_DATA.unemployment.map(v => 12 - v)), '#f87171', 2, v => v);
  drawSeries(norm(CHART_DATA.rates), '#4a4a5a', 1.5, v => v);

  const cx = pad.left + (cw / (CHART_DATA.labels.length - 1)) * (CHART_DATA.labels.length - 2);
  ctx.strokeStyle = 'rgba(91,141,239,0.25)'; ctx.setLineDash([4, 4]); ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(cx, pad.top); ctx.lineTo(cx, pad.top + ch); ctx.stroke(); ctx.setLineDash([]);
  ctx.fillStyle = '#5b8def'; ctx.font = 'bold 10px sans-serif'; ctx.fillText('NOW', cx, pad.top - 6);
}

// ============================================================
// CAUSAL LOOP PARTICLES
// ============================================================
function initCausalLoop() {
  const particlesGroup = document.getElementById('cl-particles');
  if (!particlesGroup) return;
  const arrows = document.querySelectorAll('#cl-arrows path');
  const particles = [];
  arrows.forEach((arrow, idx) => {
    const len = arrow.getTotalLength();
    const isPos = arrow.classList.contains('pos');
    const color = isPos ? '#4ade80' : '#f87171';
    for (let i = 0; i < 3; i++) {
      const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
      circle.setAttribute('r', '2.5'); circle.setAttribute('fill', color); circle.setAttribute('opacity', '0.6');
      particlesGroup.appendChild(circle);
      particles.push({ el: circle, path: arrow, len, pos: (i / 3) * len, speed: 0.6 + Math.random() * 0.5 });
    }
  });
  function animate() {
    particles.forEach(p => {
      p.pos += p.speed;
      if (p.pos > p.len) p.pos = 0;
      const pt = p.path.getPointAtLength(p.pos);
      p.el.setAttribute('cx', pt.x); p.el.setAttribute('cy', pt.y);
    });
    requestAnimationFrame(animate);
  }
  animate();
}

// ============================================================
// WORLD GDP VORONOI (D3)
// ============================================================
function initWorldGDP() {
  const svg = d3.select('#gdp-svg');
  const width = 900, height = 580;
  svg.attr('viewBox', `0 0 ${width} ${height}`);
  const pack = d3.pack().size([width, height]).padding(2);
  const root = d3.hierarchy({ children: GDP_DATA }).sum(d => d.gdp);
  pack(root);
  const sites = root.leaves().map(d => ({ x: d.x, y: d.y, r: d.r, data: d.data }));
  const delaunay = d3.Delaunay.from(sites.map(d => [d.x, d.y]));
  const voronoi = delaunay.voronoi([0, 0, width, height]);
  const g = svg.append('g');
  const centerX = width / 2, centerY = height / 2, maxR = Math.min(width, height) / 2 - 20;

  sites.forEach((site, i) => {
    const cell = voronoi.cellPolygon(i);
    if (!cell) return;
    const dist = Math.sqrt((site.x - centerX) ** 2 + (site.y - centerY) ** 2);
    if (dist > maxR) return;
    const pathData = 'M' + cell.map(p => p.join(',')).join('L') + 'Z';
    const path = g.append('path').attr('d', pathData).attr('class', 'gdp-cell').attr('fill', site.data.color).attr('opacity', 0.9);
    if (site.r > 25) {
      g.append('text').attr('class', 'gdp-label').attr('x', site.x).attr('y', site.y - 6).text(site.data.name);
      g.append('text').attr('class', 'gdp-sublabel').attr('x', site.x).attr('y', site.y + 10).text('$' + site.data.gdp + 'T');
    } else if (site.r > 12) {
      g.append('text').attr('class', 'gdp-sublabel').attr('x', site.x).attr('y', site.y + 4).text(site.data.name);
    }
  });
  g.append('circle').attr('cx', centerX).attr('cy', centerY).attr('r', maxR).attr('fill', 'none').attr('stroke', '#2a2a3a').attr('stroke-width', 2);
}

function populateFilters() {
  const regions = [...new Set(allEvents.map(e => e.region).filter(Boolean))].sort();
  const sources = [...new Set(allEvents.map(e => e.sourceType).filter(Boolean))].sort();
  const rSel = document.getElementById('region-filter');
  const sSel = document.getElementById('source-filter');
  regions.forEach(r => { const o = document.createElement('option'); o.value = r; o.textContent = r; rSel.appendChild(o); });
  sources.forEach(s => { const o = document.createElement('option'); o.value = s; o.textContent = s; sSel.appendChild(o); });
}

function renderEvents() {
  const search = document.getElementById('search-input').value.toLowerCase();
  const region = document.getElementById('region-filter').value;
  const source = document.getElementById('source-filter').value;

  let filtered = allEvents.filter(ev => {
    if (activeStep && ev.step !== activeStep) return false;
    if (activePhases.size > 0 && !activePhases.has(getPhase(ev.step))) return false;
    if (search && !ev.title.toLowerCase().includes(search) && !ev.summary.toLowerCase().includes(search)) return false;
    if (region && ev.region !== region) return false;
    if (source && ev.sourceType !== source) return false;
    return true;
  });

  filtered.sort((a, b) => new Date(b.date) - new Date(a.date));
  document.getElementById('events-count').textContent = filtered.length + ' event' + (filtered.length !== 1 ? 's' : '');

  const grid = document.getElementById('events-grid');
  if (filtered.length === 0) {
    grid.innerHTML = '<div class="empty-state">no events match your filters.</div>';
    return;
  }

  grid.innerHTML = filtered.map(ev => {
    const phase = getPhase(ev.step);
    const dateStr = new Date(ev.date).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
    return `
      <div class="event-card" data-phase="${phase}" onclick="openDetail(${ev.id})">
        <div class="event-header">
          <a class="event-title" href="${ev.url}" target="_blank" onclick="event.stopPropagation()">${escapeHtml(ev.title)}</a>
          <span class="event-step ${phase}">${getStepLabel(ev.step)}</span>
        </div>
        <div class="event-meta">
          <span>${dateStr}</span>
          <span>${ev.source}</span>
          <span>${ev.region}</span>
        </div>
        <div class="event-summary">${escapeHtml(ev.summary)}</div>
        <div class="event-tags">
          ${(ev.tags || []).map(t => `<span class="event-tag">${escapeHtml(t)}</span>`).join('')}
        </div>
      </div>
    `;
  }).join('');
}

function openDetail(id) {
  const ev = allEvents.find(e => e.id === id);
  if (!ev) return;
  const phase = getPhase(ev.step);
  const step = STEPS[ev.step];
  const dateStr = new Date(ev.date).toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });

  const content = `
    <span class="detail-step ${phase}">${getStepLabel(ev.step)}</span>
    <div class="detail-title"><a href="${ev.url}" target="_blank">${escapeHtml(ev.title)}</a></div>
    <div class="detail-meta">
      <span>${dateStr}</span>
      <span>${ev.source}</span>
      <span>${ev.region}</span>
      <span>${ev.sourceType}</span>
    </div>
    <div class="detail-section"><h4>Summary</h4><p>${escapeHtml(ev.summary)}</p></div>
    ${ev.dalioConnection ? `<div class="detail-section"><h4>Connection to Dalio Cycle</h4><p>${escapeHtml(ev.dalioConnection)}</p></div>` : ''}
    ${ev.thesisConnection ? `<div class="detail-section"><h4>Capital Flow Thesis Connection</h4><p>${escapeHtml(ev.thesisConnection)}</p></div>` : ''}
    <div class="detail-section"><h4>What to Watch</h4><p>${escapeHtml(ev.watch || 'Monitor follow-on policy actions and market reactions.')}</p></div>
    <div class="detail-section"><h4>About This Step</h4><div class="step-desc"><strong>${step.name}:</strong> ${step.desc}</div></div>
    <a class="detail-link" href="${ev.url}" target="_blank">read original source &rarr;</a>
  `;

  document.getElementById('detail-content').innerHTML = content;
  document.getElementById('detail-panel').classList.add('open');
  document.getElementById('detail-overlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeDetail() {
  document.getElementById('detail-panel').classList.remove('open');
  document.getElementById('detail-overlay').classList.remove('open');
  document.body.style.overflow = '';
}

function showAbout() {
  document.getElementById('about-panel').classList.add('open');
  document.getElementById('about-overlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeAbout() {
  document.getElementById('about-panel').classList.remove('open');
  document.getElementById('about-overlay').classList.remove('open');
  document.body.style.overflow = '';
}

// ============================================================
// EVENT FREQUENCY CHART
// ============================================================
function drawFreqChart() {
  const canvas = document.getElementById('freq-chart');
  if (!canvas || allEvents.length === 0) return;
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  const rect = canvas.getBoundingClientRect();
  canvas.width = rect.width * dpr; canvas.height = rect.height * dpr;
  ctx.scale(dpr, dpr);
  const w = rect.width, h = rect.height;
  const pad = { top: 20, right: 20, bottom: 40, left: 40 };
  const cw = w - pad.left - pad.right, ch = h - pad.top - pad.bottom;

  const counts = {};
  allEvents.forEach(ev => {
    const key = ev.date.slice(0, 7);
    const phase = getPhase(ev.step);
    counts[key] = counts[key] || { rise: 0, top: 0, decline: 0 };
    counts[key][phase]++;
  });
  const months = Object.keys(counts).sort();
  if (months.length === 0) return;

  const maxCount = Math.max(...months.map(m => counts[m].rise + counts[m].top + counts[m].decline), 1);
  const barW = cw / months.length * 0.7;
  const gap = cw / months.length * 0.3;

  ctx.clearRect(0, 0, w, h);
  ctx.fillStyle = 'rgba(42,42,58,0.3)';
  for (let i = 0; i <= 4; i++) {
    const y = pad.top + (ch / 4) * i;
    ctx.fillRect(pad.left, y, cw, 1);
  }

  months.forEach((month, i) => {
    const x = pad.left + (cw / months.length) * i + gap / 2;
    let y = pad.top + ch;
    ['decline', 'top', 'rise'].forEach(phase => {
      const count = counts[month][phase];
      const barH = (count / maxCount) * ch;
      const color = phase === 'rise' ? '#4ade80' : phase === 'top' ? '#fbbf24' : '#f87171';
      ctx.fillStyle = color;
      ctx.fillRect(x, y - barH, barW, barH);
      y -= barH;
    });
    ctx.fillStyle = '#6a6a80';
    ctx.font = '9px "SF Mono", monospace';
    ctx.textAlign = 'center';
    const label = month.slice(5) + '/' + month.slice(2, 4);
    ctx.fillText(label, x + barW / 2, h - 8);
  });
}

// ============================================================
// FILTER HANDLERS
// ============================================================
document.getElementById('search-input').addEventListener('input', renderEvents);
document.getElementById('region-filter').addEventListener('change', renderEvents);
document.getElementById('source-filter').addEventListener('change', renderEvents);

document.querySelectorAll('.filter-pill').forEach(pill => {
  pill.addEventListener('click', () => {
    const phase = pill.dataset.phase;
    if (phase === '') {
      activePhases.clear();
      document.querySelectorAll('.filter-pill').forEach(p => p.classList.remove('active'));
      pill.classList.add('active');
    } else {
      if (activePhases.has(phase)) activePhases.delete(phase);
      else activePhases.add(phase);
      document.querySelectorAll('.filter-pill[data-phase=""]').forEach(p => p.classList.remove('active'));
      pill.classList.toggle('active');
    }
    renderEvents();
  });
});

// ============================================================
// NAV HIGHLIGHTING
// ============================================================
function initNav() {
  const links = document.querySelectorAll('.nav-links a');
  const sections = document.querySelectorAll('.section');
  const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        links.forEach(l => l.classList.remove('active'));
        const link = document.querySelector(`.nav-links a[href="#${entry.target.id}"]`);
        if (link) link.classList.add('active');
      }
    });
  }, { threshold: 0.2 });
  sections.forEach(s => observer.observe(s));
}

  drawEconChart();
